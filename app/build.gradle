plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Ensure this matches your Kotlin version for Compose support
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.ezio.unishare"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.ezio.unishare"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // --- 1. Networking (Fedora Backend) ---
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // --- 2. Image Handling & Cloud ---
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.cloudinary:cloudinary-android:2.3.1'

    // --- 3. Firebase (Legacy Support) ---
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'

    // --- 4. Navigation & Core UI ---
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // --- 5. Compose BOM & Libraries ---
    def composeBom = platform('androidx.compose:compose-bom:2024.02.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}