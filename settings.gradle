pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google() // Essential for standard Android libraries
        mavenCentral() // Essential for Retrofit and GSON
        maven { url 'https://jitpack.io' } // Useful for other 3rd party libraries
    }
}

rootProject.name = "PeerRentApp"
include ':app'